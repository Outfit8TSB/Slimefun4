name: Publish a release to Hangar and Modrinth

on:
  push:
    branches:
      - master

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository_owner == 'Slimefun-United'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Get Maven project version
        id: maven_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Compute jar filename
        id: jar
        run: echo "JAR_FILE=target/slimefun-united-${{ steps.maven_version.outputs.VERSION }}.jar" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: adopt
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Build and package with Maven
        run: mvn clean package

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: EOlkO9GO
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          channel: release
          loaders: |-
            paper
            purpur
          game-versions: |-
            1.19.x
            1.20.x
            1.21.x
          files: ${{ steps.jar.outputs.JAR_FILE }}